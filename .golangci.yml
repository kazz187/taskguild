version: "2"

run:
  tests: true

linters:
  default: all
  disable:
    - exhaustruct
    - exhaustruct_v5
    - wrapcheck
    - varnamelen
    - ireturn
    - nlreturn
    - wsl
    - tagalign
    - godot
    - godox
    - gochecknoglobals
    - gochecknoinits
    - depguard
    - gocyclo
    - funlen

  settings:
    cyclop:
      max-complexity: 20
      package-average: 10.0

    gocognit:
      min-complexity: 25

    goconst:
      # goconst 1.11 はパッケージ単位でカウントするため、テストの fixture 文字列が
      # 大量に発砲する。テストのリテラル重複は可読性上むしろ望ましいので除外する。
      # なお exclusions.rules では代替できない（カウントがパッケージ横断のため）。
      ignore-tests: true
      # boolean を文字列で持つ metadata (map[string]string) の比較値。定数化する価値がない。
      ignore-string-values:
        - '^(?:true|false)$'

    dupl:
      threshold: 100

    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true

    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true

    staticcheck:
      checks:
        - all

    misspell:
      locale: US

  exclusions:
    paths:
      - proto/gen

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
    - gci

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/kazz187)

  exclusions:
    paths:
      - proto/gen
