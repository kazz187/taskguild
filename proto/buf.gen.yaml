version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/kazz187/taskguild/proto/gen/go
inputs:
  - directory: .
  # Pinned to the protovalidate commit in buf.lock; keep the two in sync.
  - module: buf.build/bufbuild/protovalidate:80ab13bee0bf4272b6161a72bf7034e0
plugins:
  # Go protobuf (keep in step with google.golang.org/protobuf in go.mod)
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ./gen/go
    opt: paths=source_relative
  # Connect Go
  - remote: buf.build/connectrpc/go:v2.0.0
    out: ./gen/go
    opt: paths=source_relative
  # TypeScript (ES modules)
  - remote: buf.build/bufbuild/es:v2.9.0
    out: ./gen/ts
    opt:
      - import_extension=.ts
      - target=ts
  # Connect-Query (TanStack Query integration)
  - remote: buf.build/connectrpc/query-es:v2.2.0
    out: ./gen/ts
    opt:
      - import_extension=.ts
      - target=ts
